[project]
name = "systemd-compose"
version = "0.1.0"
description = "Compose-like transient systemd user units with mandatory bwrap sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
systemd-compose = "systemd_compose:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
